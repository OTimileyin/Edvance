org.gradle.jvmargs=-Xmx1536m
# The AndroidX libraries androidbrowserhelper depends on are shipped as
# AndroidX artifacts, so the legacy support-library mappings must be off.
android.useAndroidX=true
# Each library's R class is generated into its own package instead of one
# merged class, which is what the current AndroidX artifacts expect.
android.nonTransitiveRClass=true
