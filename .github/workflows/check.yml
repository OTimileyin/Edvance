name: check

# Runs on every push — and on pull requests — so a broken change is caught
# before it can be deployed. `npm run check` is the same offline gate used
# locally: `tsc --noEmit` followed by the dependency-free unit suite.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 is required. The unit tests import TypeScript modules directly
      # (`lib/*.ts`) and rely on Node's built-in type stripping, which is enabled
      # by default from Node 23.6 and is not available on older lines.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

  # Runs the real production build so a Next.js build break is caught here
  # rather than surfacing as a failed deploy on the target platform. It is
  # the same build Vercel runs: `npm run build` (Next 16 / Turbopack) on Node 24.
  #
  # The three env vars are BUILD-TIME PLACEHOLDERS only — they let the Next.js
  # server bundle resolve lib/db.ts and the Better Auth setup at build time
  # without touching real infrastructure. None of them reach a database or a
  # provider during `next build`; they exist purely so module import does not
  # crash the bundle. They are deliberately invalid at runtime.
build:
  name: production build
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    # Node 24, matching the check job and the deployed server.
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Production build
      env:
        DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
        BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-for-runtime-use
        BETTER_AUTH_URL: http://localhost:3000
        NEXT_TELEMETRY_DISABLED: 1
      run: npm run build
