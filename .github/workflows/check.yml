name: check

# Runs on every push — and on pull requests — so a broken change is caught
# before it can be deployed. `npm run check` is the same offline gate used
# locally: `tsc --noEmit` followed by the dependency-free unit suite.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 is required. The unit tests import TypeScript modules directly
      # (`lib/*.ts`) and rely on Node's built-in type stripping, which is enabled
      # by default from Node 23.6 and is not available on older lines.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check
