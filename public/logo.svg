  </g>

  <!-- Wordmark (Fraunces where available, Georgia fallback) -->
  <text x="56" y="33" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" letter-spacing="-0.8" fill="#0D2327">Edvance</text>
  <text x="57" y="46" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2.6" fill="#C9502E">COURSE INTELLIGENCE</text>
