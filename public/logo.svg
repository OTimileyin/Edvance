<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-label="Oyevolve">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B5CC4" />
      <stop offset="58%" stop-color="#2F3E92" />
      <stop offset="100%" stop-color="#1E2A6B" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Mark: plush seal with one accent per source bar (mustard, rust, teal-green) -->
  <g transform="translate(4 8)">
    <rect width="40" height="40" rx="12" fill="url(#seal)" />
    <rect x="1.25" y="1.25" width="37.5" height="37.5" rx="11" fill="none" stroke="#FAF4E7" stroke-opacity="0.16" />
    <rect width="40" height="16" rx="12" fill="url(#gloss)" />
    <rect x="11.5" y="11.6" width="17" height="3.7" rx="1.85" fill="#E8A828" />
    <rect x="11.5" y="18.15" width="12.6" height="3.7" rx="1.85" fill="#D6452F" />
    <rect x="11.5" y="24.7" width="8.6" height="3.7" rx="1.85" fill="#1A8E7F" />
  </g>

  <!-- Wordmark (Fredoka where available, Trebuchet/Verdana fallback) -->
  <text x="56" y="33" font-family="Fredoka, 'Trebuchet MS', Verdana, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.8" fill="#1E2A6B">Oyevolve</text>
  <text x="57" y="46" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2.6" fill="#C43A28">COURSE INTELLIGENCE</text>
</svg>
